version: '3.8'
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    privileged: true
    ports:
      - "5050:8080"
      - "50050:50000"
    volumes:
      # Persistir datos de Jenkins
      - jenkins-data:/var/jenkins_home
      # Acceso al socket de Docker del host (CRÍTICO)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins-net
    environment:
      # Variable para Configuration as Code
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/jenkins.yaml
      # Saltarse el setup wizard
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

volumes:
  jenkins-data:

networks:
  jenkins-net: